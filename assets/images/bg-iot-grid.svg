<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="iotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1B2B"/>
      <stop offset="60%" stop-color="#112236"/>
      <stop offset="100%" stop-color="#0a1522"/>
    </linearGradient>
    <radialGradient id="meshGlow" cx="70%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1DA1B9" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3B6FE0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0E1B2B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#iotGrad)"/>
  <rect width="1200" height="600" fill="url(#meshGlow)"/>

  <!-- Isometric / Network Mesh -->
  <g stroke="#1DA1B9" stroke-opacity="0.25" stroke-width="1.2" fill="none">
    <line x1="500" y1="100" x2="680" y2="180"/>
    <line x1="680" y1="180" x2="850" y2="120"/>
    <line x1="850" y1="120" x2="1020" y2="200"/>
    <line x1="1020" y1="200" x2="1150" y2="150"/>

    <line x1="450" y1="260" x2="620" y2="340"/>
    <line x1="620" y1="340" x2="800" y2="280"/>
    <line x1="800" y1="280" x2="980" y2="360"/>
    <line x1="980" y1="360" x2="1120" y2="300"/>

    <line x1="550" y1="420" x2="720" y2="500"/>
    <line x1="720" y1="500" x2="900" y2="440"/>
    <line x1="900" y1="440" x2="1060" y2="520"/>

    <!-- Cross Verticals -->
    <line x1="680" y1="180" x2="620" y2="340"/>
    <line x1="850" y1="120" x2="800" y2="280"/>
    <line x1="1020" y1="200" x2="980" y2="360"/>
    <line x1="620" y1="340" x2="720" y2="500"/>
    <line x1="800" y1="280" x2="900" y2="440"/>
    <line x1="980" y1="360" x2="1060" y2="520"/>
  </g>

  <!-- WiFi & Wireless Radio Pulse Waves -->
  <g fill="none" stroke="#00B574" stroke-opacity="0.4" stroke-width="1.8">
    <circle cx="850" cy="220" r="40" stroke-dasharray="4,4"/>
    <circle cx="850" cy="220" r="80" stroke-dasharray="6,6"/>
    <circle cx="850" cy="220" r="130" stroke-dasharray="8,8"/>
    <circle cx="850" cy="220" r="190" stroke-dasharray="10,10" stroke-opacity="0.2"/>
  </g>

  <!-- High-Tech Nodes -->
  <g fill="#00B574">
    <circle cx="850" cy="220" r="7"/>
    <circle cx="680" cy="180" r="5"/>
    <circle cx="800" cy="280" r="6"/>
    <circle cx="980" cy="360" r="5"/>
    <circle cx="720" cy="500" r="5"/>
  </g>
  <g fill="#3B6FE0">
    <circle cx="620" cy="340" r="5"/>
    <circle cx="1020" cy="200" r="6"/>
    <circle cx="900" cy="440" r="5"/>
  </g>
</svg>
