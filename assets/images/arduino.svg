<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0E1B2B"/>
  <rect x="50" y="50" width="500" height="300" rx="16" fill="#008184" stroke="#1f3857" stroke-width="4"/>
  <text x="320" y="140" font-family="'Cairo', sans-serif" font-weight="900" font-size="36" fill="#ffffff">ARDUINO</text>
  <text x="320" y="175" font-family="'Cairo', monospace" font-size="20" font-weight="bold" fill="#facc15">UNO R3</text>
  <!-- ATmega328P DIP chip -->
  <rect x="240" y="220" width="220" height="50" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="350" y="250" font-family="monospace" font-size="14" fill="#94a3b8" text-anchor="middle">ATmega328P-PU</text>
  <!-- USB Type-B Port -->
  <rect x="50" y="90" width="70" height="70" rx="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3"/>
  <rect x="65" y="110" width="40" height="30" rx="2" fill="#334155"/>
  <!-- Power Jack -->
  <rect x="50" y="240" width="80" height="60" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
  <circle cx="75" cy="270" r="10" fill="#0f172a"/>
  <!-- Header Pins Top & Bottom -->
  <rect x="200" y="50" width="310" height="20" fill="#1e293b"/>
  <rect x="250" y="330" width="260" height="20" fill="#1e293b"/>
  <text x="350" y="42" font-family="'Cairo', monospace" font-size="12" fill="#94a3b8" text-anchor="middle">DIGITAL (PWM ~)</text>
  <text x="380" y="370" font-family="'Cairo', monospace" font-size="12" fill="#94a3b8" text-anchor="middle">ANALOG IN / POWER</text>
  <!-- Reset button -->
  <circle cx="150" cy="80" r="12" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
</svg>