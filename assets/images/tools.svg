<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0E1B2B"/>
  <rect x="50" y="50" width="500" height="300" rx="20" fill="#132438" stroke="#7C3AED" stroke-width="3"/>
  <!-- Multimeter Device -->
  <rect x="200" y="80" width="200" height="250" rx="18" fill="#1e293b" stroke="#eab308" stroke-width="4"/>
  <!-- Screen -->
  <rect x="225" y="105" width="150" height="65" rx="6" fill="#84cc16"/>
  <text x="300" y="152" font-family="monospace" font-size="34" font-weight="bold" fill="#14532d" text-anchor="middle">5.00 V</text>
  <!-- Rotary Dial -->
  <circle cx="300" cy="225" r="35" fill="#334155" stroke="#94a3b8" stroke-width="3"/>
  <line x1="300" y1="225" x2="300" y2="195" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <!-- Probe Jack Sockets -->
  <circle cx="250" cy="290" r="10" fill="#ef4444"/>
  <circle cx="300" cy="290" r="10" fill="#0f172a"/>
  <circle cx="350" cy="290" r="10" fill="#ef4444"/>
  <text x="300" y="365" font-family="'Cairo', sans-serif" font-size="16" font-weight="bold" fill="#7C3AED" text-anchor="middle">True RMS Digital Multimeter</text>
</svg>