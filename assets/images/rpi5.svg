<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0E1B2B"/>
  <rect x="50" y="50" width="500" height="300" rx="20" fill="#065f46" stroke="#047857" stroke-width="4"/>
  <!-- SoC with heatspreader -->
  <rect x="230" y="140" width="130" height="130" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="295" y="200" font-family="'Cairo', sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">Broadcom</text>
  <text x="295" y="225" font-family="monospace" font-size="14" fill="#334155" text-anchor="middle">BCM2712</text>
  <text x="295" y="245" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">2.4GHz Quad</text>
  <!-- Raspberry Pi Logo -->
  <circle cx="130" cy="110" r="28" fill="#dc2626"/>
  <text x="130" y="118" font-family="'Cairo', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">Pi 5</text>
  <text x="130" y="160" font-family="'Cairo', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">8GB RAM</text>
  <!-- 40-Pin GPIO -->
  <rect x="180" y="60" width="340" height="25" rx="3" fill="#1e293b"/>
  <!-- Ports (USB & Ethernet) -->
  <rect x="490" y="110" width="60" height="70" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <rect x="490" y="200" width="60" height="70" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="520" y="150" font-family="monospace" font-size="11" fill="#0f172a" text-anchor="middle">ETH</text>
  <text x="520" y="240" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">USB 3.0</text>
  <!-- Dual Micro HDMI -->
  <rect x="140" y="325" width="40" height="20" rx="2" fill="#cbd5e1"/>
  <rect x="200" y="325" width="40" height="20" rx="2" fill="#cbd5e1"/>
  <text x="190" y="370" font-family="'Cairo', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Dual 4K Micro-HDMI</text>
</svg>